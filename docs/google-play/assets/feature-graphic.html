<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 500px;
    background: radial-gradient(circle at center, #0a1128 0%, #02040a 80%, #000205 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .grid {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: 
      linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .glow-circle {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, rgba(255, 215, 0, 0.15) 50%, transparent 70%);
    filter: blur(20px);
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    font-size: 82px;
    font-weight: 900;
    letter-spacing: 14px;
    background: linear-gradient(135deg, #00f0ff 0%, #ffffff 50%, #ffd700 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(0, 240, 255, 0.6);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .tagline {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 6px;
    color: #e0f7fa;
    text-transform: uppercase;
    margin-bottom: 24px;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
  }
  .features {
    display: flex;
    gap: 20px;
    margin-top: 10px;
  }
  .badge {
    background: rgba(0, 240, 255, 0.08);
    border: 1px solid rgba(0, 240, 255, 0.3);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #b2ebf2;
    text-transform: uppercase;
    backdrop-filter: blur(5px);
  }
  .badge-gold {
    background: rgba(255, 215, 0, 0.08);
    border-color: rgba(255, 215, 0, 0.4);
    color: #fff9c4;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow-circle"></div>
  <div class="content">
    <h1 class="logo">QLIZE</h1>
    <div class="tagline">Cyber-Zen Vectorial Jumper</div>
    <div class="features">
      <span class="badge badge-gold">✦ 10 Reinos Sefirot</span>
      <span class="badge">✦ Salto Vectorial 120 FPS</span>
      <span class="badge badge-gold">✦ Fase Entropía</span>
      <span class="badge">✦ 100% Offline</span>
    </div>
  </div>
</body>
</html>
