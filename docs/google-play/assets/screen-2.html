<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; background: radial-gradient(circle at 50% 30%, #1a102f 0%, #05020c 70%, #000 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 120px 60px 100px; text-align: center; position: relative; overflow: hidden; }
.grid { position: absolute; width: 100%; height: 100%; top: 0; left: 0; background-image: linear-gradient(rgba(179, 136, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(179, 136, 255, 0.05) 1px, transparent 1px); background-size: 60px 60px; }
.title { font-size: 64px; font-weight: 900; letter-spacing: 4px; color: #b388ff; text-shadow: 0 0 30px rgba(179, 136, 255, 0.6); margin-bottom: 20px; text-transform: uppercase; }
.subtitle { font-size: 32px; font-weight: 500; letter-spacing: 2px; color: #ede7f6; max-width: 900px; line-height: 1.4; }
.card { position: relative; z-index: 10; width: 860px; height: 1200px; background: rgba(30, 15, 55, 0.6); border: 2px solid rgba(179, 136, 255, 0.4); border-radius: 40px; box-shadow: 0 0 60px rgba(179, 136, 255, 0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); padding: 40px; }
.stage-item { width: 85%; padding: 20px; margin-bottom: 15px; background: rgba(179, 136, 255, 0.1); border: 1px solid rgba(179, 136, 255, 0.4); border-radius: 20px; font-size: 26px; font-weight: 700; color: #fff; display: flex; justify-content: space-between; }
</style></head>
<body>
<div class="grid"></div>
<div style="position:relative;z-index:10;"><h1 class="title">10 REINOS CELESTIALES</h1><p class="subtitle">Conquista las Sefirot desde Málkuth hasta Kéter</p></div>
<div class="card">
  <div class="stage-item" style="border-color:#ffd700;color:#ffd700;"><span>👑 KÉTER (La Corona)</span><span>5000m</span></div>
  <div class="stage-item"><span>✦ JOJMÁ & BINÁ</span><span>4000m</span></div>
  <div class="stage-item"><span>✦ TIFÉRET (La Armonía)</span><span>2500m</span></div>
  <div class="stage-item"><span>✦ YESOD (El Fundamento)</span><span>1000m</span></div>
  <div class="stage-item" style="border-color:#00f0ff;color:#00f0ff;"><span>✦ MÁLKUTH (El Reino)</span><span>0m</span></div>
</div>
</body></html>
