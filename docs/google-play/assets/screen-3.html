<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; background: radial-gradient(circle at 50% 30%, #2a0808 0%, #0a0101 70%, #000 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 120px 60px 100px; text-align: center; position: relative; overflow: hidden; }
.grid { position: absolute; width: 100%; height: 100%; top: 0; left: 0; background-image: linear-gradient(rgba(255, 68, 68, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 68, 68, 0.05) 1px, transparent 1px); background-size: 60px 60px; }
.title { font-size: 64px; font-weight: 900; letter-spacing: 4px; color: #ff5252; text-shadow: 0 0 30px rgba(255, 82, 82, 0.6); margin-bottom: 20px; text-transform: uppercase; }
.subtitle { font-size: 32px; font-weight: 500; letter-spacing: 2px; color: #ffebee; max-width: 900px; line-height: 1.4; }
.card { position: relative; z-index: 10; width: 860px; height: 1200px; background: rgba(50, 10, 10, 0.6); border: 2px solid rgba(255, 82, 82, 0.5); border-radius: 40px; box-shadow: 0 0 60px rgba(255, 82, 82, 0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); padding: 40px; }
.entropy-tag { font-size: 90px; font-weight: 900; letter-spacing: 12px; color: #ff1744; text-shadow: 0 0 40px rgba(255, 23, 68, 0.8); margin-bottom: 30px; }
.entropy-desc { font-size: 28px; line-height: 1.6; color: #ffcdd2; max-width: 700px; letter-spacing: 2px; }
</style></head>
<body>
<div class="grid"></div>
<div style="position:relative;z-index:10;"><h1 class="title">FASE ENTROPÍA</h1><p class="subtitle">La realidad colapsa y la gravedad se invierte</p></div>
<div class="card">
  <div class="entropy-tag">ENTROPÍA</div>
  <p class="entropy-desc">Desciende rebotando en plataformas invertidas para restaurar el orden y superar tu récord cósmico.</p>
</div>
</body></html>
